name: ci
on: [push, pull_request]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check
      - run: cargo clippy -p tufan-core -p tufan-cli --all-targets -- -D warnings
      - run: cargo test --release -p tufan-core
      - run: cargo build --release -p tufan-cli
  gtk-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - run: cargo clippy --release -p tufan-gtk -- -D warnings
  gtk-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-rust mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-binutils
      - run: cargo clippy --release -p tufan-gtk -- -D warnings
  gtk-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install gtk4 pkg-config
      - run: cargo clippy --release -p tufan-gtk -- -D warnings
