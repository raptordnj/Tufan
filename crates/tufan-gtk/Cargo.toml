[package]
name = "tufan-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tufan-core = { path = "../tufan-core" }
gtk4 = { version = "0.11", features = ["v4_10"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Variant", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_Security"] }

[build-dependencies]
embed-resource = "3.0.12"
